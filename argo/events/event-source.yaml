apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: qaendtoend-vikas-event-source
  namespace: argo-events
spec:
  webhook:
    # Source 1: Claude Project command
    claude-command:
      port: "12000"
      endpoint: /claude-trigger
      method: POST
      # Payload: { "story_id": "PROJ-1234", "source": "claude-project", "requested_by": "vshere@legion.co" }

    # Source 2: Slack command
    slack-command:
      port: "12000"
      endpoint: /slack-trigger
      method: POST
      # Payload: { "story_id": "PROJ-1234", "source": "slack", "channel": "#qa-end-to-end-vikas", "requested_by": "U09LALEF9AL" }
