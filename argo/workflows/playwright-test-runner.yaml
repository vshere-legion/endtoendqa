apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: qaendtoend-vikas-pw-
  labels:
    app: qa-pipeline
    owner: vshere
spec:
  entrypoint: main
  onExit: exit-handler

  arguments:
    parameters:
      - name: repo
        value: "https://github.com/legionco/playwright-automation-framework.git"
      - name: branch
        value: "master"
      - name: team
        value: "SCH"
      - name: environment
        value: "rc"
      - name: enterprise
        value: "cinemark-wkdy"
      - name: browser
        value: "chromium"
      - name: tags
        value: "@ER-2600"
      - name: workers
        value: "2"
      - name: shards
        value: "1"
      - name: retries
        value: "1"
      - name: timeout
        value: "60000"
      - name: enable-rerun
        value: "false"
      - name: slack-bot-token
        value: ""
      - name: argo-base-url
        value: "https://argo.ops.dev.legion.work"
      - name: testrail-url
        value: ""
      - name: testrail-user
        value: ""
      - name: testrail-password
        value: ""
      - name: testrail-project-id
        value: ""
      - name: testrail-suite-id
        value: ""

  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 600s
  ttlStrategy:
    secondsAfterCompletion: 3600
    secondsAfterFailure: 7200
  activeDeadlineSeconds: 3600

  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi

  templates:
    - name: main
      dag:
        tasks:
          # Step 1: Quality Gate
          - name: quality-gate
            templateRef:
              name: playwright-bdd-tests
              template: quality-gate
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"

          # Step 2: BDD Generate
          - name: bddgen
            templateRef:
              name: playwright-bdd-tests
              template: bddgen
            depends: "quality-gate"
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
                - name: team
                  value: "{{workflow.parameters.team}}"
                - name: tags
                  value: "{{workflow.parameters.tags}}"
                - name: environment
                  value: "{{workflow.parameters.environment}}"

          # Step 3: Single Shard Test Run
          - name: test-shard-1
            templateRef:
              name: playwright-bdd-tests
              template: test-shard
            depends: "bddgen"
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
                - name: shard
                  value: "1"
                - name: total-shards
                  value: "1"
                - name: team
                  value: "{{workflow.parameters.team}}"
                - name: environment
                  value: "{{workflow.parameters.environment}}"
                - name: enterprise
                  value: "{{workflow.parameters.enterprise}}"
                - name: browser
                  value: "{{workflow.parameters.browser}}"
                - name: tags
                  value: "{{workflow.parameters.tags}}"
                - name: workers
                  value: "{{workflow.parameters.workers}}"
                - name: retries
                  value: "{{workflow.parameters.retries}}"
                - name: timeout
                  value: "{{workflow.parameters.timeout}}"
              artifacts:
                - name: features-gen
                  from: "{{tasks.bddgen.outputs.artifacts.features-gen}}"

          # Step 4: Merge Reports
          - name: merge-reports
            templateRef:
              name: playwright-bdd-tests
              template: merge-reports
            depends: "test-shard-1.Succeeded || test-shard-1.Failed"
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
                - name: total-shards
                  value: "1"
              artifacts:
                - name: blob-report-1
                  from: "{{tasks.test-shard-1.outputs.artifacts.blob-report}}"
                  optional: true

    # ─── Exit Handler: Notify Slack ───────────────────────────
    - name: exit-handler
      steps:
        - - name: notify
            templateRef:
              name: playwright-bdd-tests
              template: notify
            arguments:
              parameters:
                - name: repo
                  value: "{{workflow.parameters.repo}}"
                - name: branch
                  value: "{{workflow.parameters.branch}}"
                - name: workflow-status
                  value: "{{workflow.status}}"
                - name: workflow-name
                  value: "{{workflow.name}}"
                - name: environment
                  value: "{{workflow.parameters.environment}}"
                - name: enterprise
                  value: "{{workflow.parameters.enterprise}}"
                - name: team
                  value: "{{workflow.parameters.team}}"
                - name: argo-base-url
                  value: "{{workflow.parameters.argo-base-url}}"
                - name: testrail-url
                  value: "{{workflow.parameters.testrail-url}}"
                - name: testrail-project-id
                  value: "{{workflow.parameters.testrail-project-id}}"
                - name: testrail-run-url
                  value: ""
                - name: slack-bot-token
                  value: "{{workflow.parameters.slack-bot-token}}"
